name: Apply Read Aloud media split

on:
  push:
    branches:
      - refactor/modular-source
    paths:
      - scripts/refactor-read-aloud-media.mts
      - .github/workflows/apply-read-aloud-media-split.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply Read Aloud media extraction
        run: npx tsx scripts/refactor-read-aloud-media.mts

      - name: Validate candidate
        run: npm run validate

      - name: Build frozen baseline
        run: |
          git worktree add ../baseline c0c9c0d8b909d26694087d8de9639b397e285b25
          cd ../baseline
          git submodule update --init --recursive
          npm ci
          npm run build

      - name: Check frozen-baseline parity
        run: npm run check:parity -- ../baseline

      - name: Commit validated Read Aloud extraction
        run: |
          git config user.name "kitty"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git add src/readAloud/controller.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: use read-aloud media timing engine"
          git push origin HEAD:refactor/modular-source
